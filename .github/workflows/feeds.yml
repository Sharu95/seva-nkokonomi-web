# Fetches Skatteetaten's RSS feeds daily and commits the JSON the site reads (data/*.json).
# The feeds block cross-origin browser requests, so they can't be fetched from the page itself.
name: Oppdater frister og nyheter

on:
  schedule:
    - cron: "15 4 * * *" # daily, early morning Norwegian time
  workflow_dispatch:

permissions:
  contents: write # commit data/*.json
  pages: write # request a Pages rebuild (pushes made with GITHUB_TOKEN may not trigger one)

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A failing feed keeps its previous file and fails the job (so you get notified),
      # but whatever did update is still committed.
      - name: Fetch feeds
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_feeds.py

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- data; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: update tax deadlines and a-ordningen news"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Report feed failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::One or more feeds failed; the site keeps the previous data. See the 'Fetch feeds' step."
          exit 1
