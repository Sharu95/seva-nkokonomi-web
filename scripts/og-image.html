<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <!-- Source for assets/og-image.png (1200×630). Rendered by scripts/build-og-image.mjs. -->
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("../fonts/manrope-latin-wght.woff2") format("woff2");
        font-weight: 200 800;
        font-display: block;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #fef9f4;
        color: #1E1A15;
        font-family: "Manrope", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Soft warm glow, top right, and a faint teal wash bottom left */
      body::before,
      body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(10px);
      }
      body::before {
        width: 760px; height: 760px; right: -260px; top: -340px;
        background: radial-gradient(closest-side, rgba(240, 160, 96, 0.30), rgba(240, 160, 96, 0));
      }
      body::after {
        width: 700px; height: 700px; left: -300px; bottom: -380px;
        background: radial-gradient(closest-side, rgba(14, 116, 144, 0.12), rgba(14, 116, 144, 0));
      }
      .frame {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 150px;
      }
      .logo { width: 400px; height: auto; display: block; }
      h1 {
        margin-top: 52px;
        font-size: 56px;
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.02em;
        max-width: 680px;
      }
      .rule {
        width: 64px; height: 4px; border-radius: 2px;
        margin-top: 36px;
        background: #F97316;
      }
      .meta {
        margin-top: 28px;
        font-size: 28px;
        font-weight: 600;
        color: #0E7490;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <img class="logo" src="../assets/logo-nk-okonomi-manrope.svg" alt="NK Økonomi" />
      <h1>Regnskap og rådgivning under ett&nbsp;tak</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="meta">Hønefoss · nkokonomi.no</p>
    </main>
  </body>
</html>
