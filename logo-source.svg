<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600" width="512" height="600" role="img" aria-labelledby="title">
  <title id="title">NK Økonomi Bistand AS</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="trend" x1="120" y1="315" x2="452" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- Ring, open at upper right -->
  <path d="M406.4 165.3 A160 160 0 1 1 310.7 69.6" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round"/>

  <!-- Rising arrow bars -->
  <g fill="url(#bars)" stroke="url(#bars)" stroke-width="6" stroke-linejoin="round">
    <path d="M170 300 V238 L188 220 L206 238 V300 Z"/>
    <path d="M226 300 V198 L244 180 L262 198 V300 Z"/>
    <path d="M282 300 V158 L300 140 L318 158 V300 Z"/>
  </g>

  <!-- Trend line breaking out of the ring -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="120,315 190,278 240,292 300,238 345,248 434,94" stroke="#FFFFFF" stroke-width="30"/>
    <polyline points="120,315 190,278 240,292 300,238 345,248 434,94" stroke="url(#trend)" stroke-width="18"/>
  </g>
  <path d="M452 70 L447.1 109.1 L415.5 84.7 Z" fill="#DC2626" stroke="#DC2626" stroke-width="6" stroke-linejoin="round"/>

  <!-- Wordmark: Unbounded 600 + Geist 500 (Google Fonts, OFL). Edit here, then regenerate logo.svg with outlined text. -->
  <g text-anchor="middle">
    <text x="256" y="478" font-family="Unbounded, sans-serif" font-size="48" font-weight="600" fill="#0F172A">NK Økonomi</text>
    <text x="256" y="532" font-family="Geist, sans-serif" font-size="36" font-weight="500" fill="#0E7490" letter-spacing="5">BISTAND AS</text>
  </g>
</svg>
